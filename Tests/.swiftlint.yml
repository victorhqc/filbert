# Tests/ is exempt from the strict rules the root config turns on at `error`
# severity. Test fixtures legitimately use `URL(string:"...")!` and
# implicitly-unwrapped `XCTestCase` properties. All other rules still apply
# here, so non-strict issues (file length, etc.) remain visible.
disabled_rules:
  - force_unwrapping
  - force_cast
  - force_try
  - implicitly_unwrapped_optional
  - no_any_type
