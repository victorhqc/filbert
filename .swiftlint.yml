excluded:
  - .build
  - .delta

disabled_rules:
  - trailing_comma

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional

# Force-unwrap, force-cast, force-try, and implicitly-unwrapped optionals are
# never acceptable in Sources/. `Tests/.swiftlint.yml` exempts Tests/ from
# these strict rules.
force_unwrapping: error
force_cast: error
force_try: error
implicitly_unwrapped_optional: error

custom_rules:
  # The `Any` type is banned in Sources/. Use a concrete type, a generic, or
  # Codable. SwiftLint classifies `Any` as a `keyword`, not a
  # `typeidentifier`, so `match_kinds: [keyword]` skips comments, strings, and
  # identifiers like `hasAnyConfiguredProvider`. The case-sensitive regex lets
  # the `any` existential through. Security framework queries need `Any`;
  # silence those per line with `swiftlint:disable:next no_any_type` and say
  # why.
  no_any_type:
    name: "No Any type"
    regex: '(?<![A-Za-z_])Any(?![A-Za-z0-9_])'
    match_kinds: [keyword]
    message: "Do not use the Any type in Sources/. Use a concrete type, a generic, or Codable."
    severity: error
    included: [Sources/]
