name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation gate
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache Mint builds
        uses: actions/cache@v4
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}

      - name: Install Mint
        run: brew install mint

      - name: Install SwiftFormat and SwiftLint (pinned in Mintfile)
        run: mint bootstrap

      - name: SwiftFormat (lint)
        run: mint run swiftformat --lint .

      - name: SwiftLint
        run: mint run swiftlint

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
