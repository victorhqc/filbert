name: Release

# Fires when a maintainer publishes a GitHub Release on a `v*` tag.
# Bare tag push does nothing — the maintainer must publish a release to
# fire the pipeline (ci 02 AC7). The job-level `if:` gates on the tag
# prefix because `release` events have no tag filter of their own.

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish DMG
    if: startsWith(github.event.release.tag_name, 'v')
    # macOS 26 image → Xcode 26 / macOS 26 SDK. Building against an older SDK
    # (the macos-14 image ships SDK 14.x) makes SwiftUI/AppKit serve their
    # pre-Tahoe codepath at runtime: wrong popover material and a
    # MenuBarExtra(.window) that won't resize. build-dmg.sh asserts the SDK.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Derive version from tag
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Tag is `v<version>`; strip the leading `v` so the DMG is
          # Filbert-<version>-arm64.dmg, not Filbert-v<version>-arm64.dmg.
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-dmg.sh --version "$VERSION"

      - name: Upload DMG and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          DMG="dist/Filbert-${VERSION}-arm64.dmg"
          gh release upload --clobber "$TAG_NAME" "$DMG" "$DMG.sha256"

      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          NOTES="dist/Filbert-${VERSION}-arm64.release-notes.md"
          gh release edit --notes-file "$NOTES" "$TAG_NAME"
