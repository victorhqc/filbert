name: Release

# A published GitHub Release triggers this workflow; bare tag pushes do not.
# The job condition applies the tag prefix because release events cannot filter
# on tag names.

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish DMG
    if: ${{ startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease && !github.event.release.draft }}
    # macOS 26 image → Xcode 26 / macOS 26 SDK. Building against an older SDK
    # (the macos-14 image ships SDK 14.x) makes SwiftUI/AppKit serve their
    # pre-Tahoe codepath at runtime: wrong popover material and a
    # MenuBarExtra(.window) that won't resize. build-dmg.sh asserts the SDK.
    runs-on: macos-26
    # Holds the release-signing environment. The build step maps Apple
    # credentials and the public update key into the DMG build only;
    # --require-signing makes the job fail closed if any Apple secret is
    # missing. The private Sparkle key is mapped only to its signing step.
    # docs/signing-and-notarization.md
    environment: release-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Derive version from tag
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate stable release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --json isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$TAG_NAME" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text())
          tag = sys.argv[2]
          version = tag.removeprefix("v")
          stable_version = re.compile(r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$")
          if metadata["tagName"] != tag:
              raise SystemExit("GitHub returned a different release tag")
          if metadata["isDraft"] or metadata["isPrerelease"]:
              raise SystemExit("Only published stable releases may update the appcast")
          if version == "0.0.0" or not stable_version.fullmatch(version):
              raise SystemExit(
                  f"Stable release tags must be plain vX.Y.Z with "
                  f"no prerelease or build suffix: {tag}"
              )
          PY

      - name: Build signed and notarized DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_DEVELOPER_ID_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_ID_TEAM_ID }}
          APPLE_DEVELOPER_ID_NAME: ${{ secrets.APPLE_DEVELOPER_ID_NAME }}
          APP_NOTARY_APPLE_ID: ${{ secrets.APP_NOTARY_APPLE_ID }}
          APP_NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.APP_NOTARY_APP_SPECIFIC_PASSWORD }}
          BOOTSTRAP_UPDATE_RELEASE: ${{ vars.BOOTSTRAP_UPDATE_RELEASE || 'false' }}
        run: scripts/build-dmg.sh --version "$VERSION" --require-signing

      - name: Upload DMG and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          DMG="dist/Filbert-${VERSION}-arm64.dmg"
          gh release upload --clobber "$TAG_NAME" "$DMG" "$DMG.sha256"

      - name: Update generated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          NOTES="dist/Filbert-${VERSION}-arm64.release-notes.md"
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          CURRENT_BODY="$TEMP_DIR/current.md"
          COMPOSED_BODY="$TEMP_DIR/composed.md"

          gh release view "$TAG_NAME" --json body --jq '.body' > "$CURRENT_BODY"

          python3 - "$CURRENT_BODY" "$NOTES" "$COMPOSED_BODY" <<'PY'
          from pathlib import Path
          import sys

          current_path, generated_path, output_path = map(Path, sys.argv[1:])
          begin = "<!-- filbert-release-notes:start -->"
          end = "<!-- filbert-release-notes:end -->"
          current = current_path.read_text()
          generated = generated_path.read_text().strip()

          if not generated:
              sys.exit("Generated release notes are empty")
          if begin in generated or end in generated:
              sys.exit("Generated release notes contain reserved boundary markers")

          start_count = current.count(begin)
          end_count = current.count(end)
          if start_count == 0 and end_count == 0:
              authored = current.strip()
          elif start_count == 1 and end_count == 1:
              start = current.index(begin)
              finish = current.index(end)
              if finish < start:
                  sys.exit("Existing Filbert release-note markers are out of order")
              before = current[:start].rstrip()
              after = current[finish + len(end):].lstrip()
              authored = "\n\n".join(part for part in (before, after) if part)
          else:
              sys.exit("Existing Filbert release-note markers are malformed")

          section = f"{begin}\n{generated}\n{end}"
          body = f"{authored}\n\n{section}\n" if authored else f"{section}\n"
          output_path.write_text(body)
          PY

          gh release edit "$TAG_NAME" --notes-file "$COMPOSED_BODY"

      - name: Download Sparkle publishing tools
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-for-Swift-Package-Manager.zip" \
            -o "$RUNNER_TEMP/sparkle.zip"
          echo "8d5fb41d960b43f4a68aa14126bf62b098544ec8d191cdcc73eb14e63a8e7606  $RUNNER_TEMP/sparkle.zip" \
            | shasum -a 256 --check --status \
            || { echo "Sparkle publishing tools checksum mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sparkle"
          unzip -q "$RUNNER_TEMP/sparkle.zip" -d "$RUNNER_TEMP/sparkle"

      - name: Generate and validate stable appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] \
            || { echo "SPARKLE_PRIVATE_KEY is missing from release-signing"; exit 1; }

          dmg="dist/Filbert-${VERSION}-arm64.dmg"
          notes="dist/Filbert-${VERSION}-arm64.release-notes.md"
          input="$RUNNER_TEMP/appcast-input"
          site="$RUNNER_TEMP/appcast-site"
          mkdir -p "$input" "$site"
          cp "$dmg" "$input/"
          cp "$notes" "$input/Filbert-${VERSION}-arm64.md"
          download_url="https://github.com/victorhqc/filbert/releases/download/${TAG_NAME}/$(basename "$dmg")"

          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
                --ed-key-file - \
                --download-url-prefix "https://github.com/victorhqc/filbert/releases/download/${TAG_NAME}/" \
                --link "https://github.com/victorhqc/filbert" \
                --embed-release-notes \
                --disable-signing-warning \
                -o "$site/appcast.xml" \
                "$input"
          python3 scripts/validate-appcast.py \
            --appcast "$site/appcast.xml" \
            --version "$VERSION" \
            --download-url "$download_url" \
            --public-key "$SPARKLE_PUBLIC_ED_KEY" \
            --dmg "$dmg"
          unset SPARKLE_PRIVATE_KEY

      - name: Upload stable appcast artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-appcast
          path: ${{ runner.temp }}/appcast-site
          if-no-files-found: error

  publish-pages:
    name: Publish stable appcast to GitHub Pages
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download stable appcast
        uses: actions/download-artifact@v4
        with:
          name: stable-appcast
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
